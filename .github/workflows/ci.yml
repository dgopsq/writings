name: CI

on:
  push:
    branches: [master]
  pull_request:

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # pnpm comes from the packageManager field in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm compile

      - name: Lint and format check
        run: pnpm lint

      # Fails if a route exists that docs/architecture.md does not mention.
      - name: Docs freshness
        run: pnpm docs:check

      # Also exercises the prebuild hook, which regenerates the feeds and the
      # search index from src/posts.
      - name: Build
        run: pnpm build
